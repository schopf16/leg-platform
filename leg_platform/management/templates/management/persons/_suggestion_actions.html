{% load i18n %}<form method="post" action="{% url 'management:persons_address_suggestion' person.pk %}" class="mgmt-inline-form">
  {% csrf_token %}
  <input type="hidden" name="token" value="{{ suggestion_token }}">
  <input type="hidden" name="next" value="{{ current_url }}">
  <button type="submit" name="action" value="accept" class="btn btn-accent-outline">{% translate "Accept" %}</button>
  <button type="submit" name="action" value="dismiss" class="btn btn-secondary-action">{% translate "Do not accept" %}</button>
</form>
