{% load i18n %}{% comment %}
The button with the eye icon inside a password field (team lead decision K20). Context: ``field``
(a bound password field). It is hidden until static/js/password-toggle.js enables it.
{% endcomment %}<button type="button" class="password-toggle d-print-none" data-password-toggle hidden
        aria-controls="{{ field.id_for_label }}" aria-pressed="false"
        aria-label="{% translate 'Show password' %}"
        data-show-label="{% translate 'Show password' %}" data-hide-label="{% translate 'Hide password' %}">
  <svg class="eye" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/></svg>
  <svg class="eye-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.4 10.4 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.5 6.5C3.8 8.3 2 12 2 12s3.6 7 10 7c1.7 0 3.2-.4 4.5-1.1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
</button>
