{% extends "base.html" %}
{% load i18n %}
{% block title %}{% translate "Choose a new password" %}{% endblock %}
{% block content %}
  <div class="card card-md">
    <div class="card-body">
      <h1 class="h2 mb-3">{% translate "Choose a new password" %}</h1>
      <form method="post" novalidate>
        {% csrf_token %}
        {% include "accounts/_form_fields.html" %}
        <button type="submit" class="btn btn-primary w-100">{% translate "Save password" %}</button>
      </form>
    </div>
  </div>
{% endblock %}
