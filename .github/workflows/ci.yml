# Continuous integration of LEG-Platform (docs/DECISIONS.md, D-015, D-026, D-027, D-030).
#
# Two jobs prove both ends of the supported range:
# - minimum: the declared minimum versions (requirements/minimum-constraints.txt) with
#   Python 3.12 and MariaDB 10.11 LTS;
# - latest: the newest compatible releases with Python 3.14 and MariaDB 12.3 LTS.
#
# Hardening (GitHub documentation "Security hardening for GitHub Actions"): read-only
# token, no repository secrets, third-party actions pinned to full commit SHAs, service
# images pinned by digest, matrix values passed to scripts through environment variables
# instead of expressions inside "run".
#
# Service images: the digests are those of the multi-platform image index of the official
# Docker image "mariadb" for the tag named in the comment, read from
# https://hub.docker.com/v2/repositories/library/mariadb/tags/<tag> on 2026-10-11. Dependabot
# does not update images in workflow files (only actions referenced with "uses"); update the
# tag and digest manually when a new patch release is published.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: minimum (Python 3.12, Django 6.0, MariaDB 10.11)
            python-version: "3.12"
            # mariadb:10.11 (= 10.11.19)
            mariadb-image: mariadb:10.11.19@sha256:7db29378d4fdab73f8123bbc2b48905c90d1a4b00cf848b028f1e81e623257f2
            install-mode: minimum
            django-series: "6.0"
          - name: latest (Python 3.14, Django 6.1, MariaDB 12.3)
            python-version: "3.14"
            # mariadb:12.3 (= 12.3.3)
            mariadb-image: mariadb:12.3.3@sha256:2bdff1534a7e569fecaf4b10b66ad0d410806e382d9db29ba305448addda97c4
            install-mode: latest
            django-series: "6.1"

    services:
      mariadb:
        image: ${{ matrix.mariadb-image }}
        env:
          # Throwaway credentials of a service container that exists only during this job;
          # not a secret of any environment. Variables of the official image (Docker Hub,
          # library/mariadb).
          MARIADB_ROOT_PASSWORD: ci-only-throwaway-password
        ports:
          - 3306:3306
        # healthcheck.sh is part of the official image: --connect is "Active when an external
        # user can connect to the TCP port", --innodb_initialized is "True when InnoDB has
        # completed initializing" (MariaDB documentation, "Using Healthcheck.sh").
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    env:
      APP_ENV: local
      DJANGO_DEBUG: "False"
      EMAIL_MODE: console
      DB_NAME: leg_platform
      # DB_USER and DB_PASSWORD are set by the step "Create the database and the application account": the
      # checks and tests run with the narrow privileges of the application account.
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      PYTHONWARNINGS: error::DeprecationWarning,error::PendingDeprecationWarning

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Check that the minimum pins match the declared lower bounds
        run: python scripts/check_minimum_constraints.py

      - name: Install build dependencies of mysqlclient
        # mysqlclient publishes no Linux wheels; packages as listed in its installation notes.
        # gettext provides msgfmt and msgunfmt for the translation check.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-dev default-libmysqlclient-dev build-essential pkg-config gettext

      - name: Check that the committed compiled translations match their sources
        # The .mo files are committed (D-034). Their decompiled content is compared, because
        # the binary layout can differ between gettext versions (GNU gettext manual, sections
        # "Invoking the msgfmt Program" and "Invoking the msgunfmt Program").
        run: |
          set -euo pipefail
          mapfile -t catalogues < <(git ls-files 'locale/*.po')
          if [ "${#catalogues[@]}" -eq 0 ]; then
            echo "No translation catalogue is tracked in Git." >&2
            exit 1
          fi
          for po in "${catalogues[@]}"; do
            mo="${po%.po}.mo"
            test -f "$mo" || { echo "Missing compiled catalogue: $mo" >&2; exit 1; }
            msgfmt --check -o "$RUNNER_TEMP/compiled.mo" "$po"
            diff <(msgunfmt "$mo") <(msgunfmt "$RUNNER_TEMP/compiled.mo") \
              || { echo "Outdated compiled catalogue: $mo (run compilemessages)" >&2; exit 1; }
          done

      - name: Install the project
        env:
          PYTHONWARNINGS: ""
          INSTALL_MODE: ${{ matrix.install-mode }}
        run: |
          python -m pip install --upgrade pip
          case "$INSTALL_MODE" in
            minimum) python -m pip install -c requirements/minimum-constraints.txt -e . ;;
            latest) python -m pip install --upgrade -e . ;;
            *) echo "Unknown install mode: $INSTALL_MODE" >&2; exit 1 ;;
          esac
          python -m pip freeze

      - name: Verify the Django release line
        env:
          DJANGO_SERIES: ${{ matrix.django-series }}
        run: python -c "import django, os, sys; s = os.environ['DJANGO_SERIES']; v = django.get_version(); print(v); sys.exit(0 if v == s or v.startswith(s + '.') else 1)"

      - name: Generate a throwaway secret key
        # Generated per job and masked; it protects nothing.
        run: |
          key="$(python -c 'import secrets; print(secrets.token_urlsafe(50))')"
          echo "::add-mask::$key"
          echo "DJANGO_SECRET_KEY=$key" >> "$GITHUB_ENV"

      - name: Create the database and the application account
        # The database is created with utf8mb4 and utf8mb4_uca1400_ai_ci, as every database of
        # an instance (D-031). Same privileges as the local setup (docs/INSTALLATION.md, "Database privileges"), on
        # leg_platform and Django's test database only, with "_" escaped. The host is '%'
        # because the job reaches the service container through Docker's network. The
        # generated password is masked and protects nothing beyond this job.
        env:
          ROOT_PASSWORD: ci-only-throwaway-password
        run: |
          python - <<'EOF'
          import os
          import secrets

          import MySQLdb

          password = secrets.token_urlsafe(32)
          print(f"::add-mask::{password}")
          privileges = "SELECT, INSERT, UPDATE, DELETE, CREATE, DROP, ALTER, INDEX"
          databases = [r"leg\_platform", r"test\_leg\_platform"]
          connection = MySQLdb.connect(
              host=os.environ["DB_HOST"],
              port=int(os.environ["DB_PORT"]),
              user="root",
              password=os.environ["ROOT_PASSWORD"],
          )
          cursor = connection.cursor()
          cursor.execute("CREATE DATABASE `leg_platform` CHARACTER SET utf8mb4 COLLATE utf8mb4_uca1400_ai_ci")
          cursor.execute(f"CREATE USER 'leg_platform'@'%' IDENTIFIED BY '{password}'")
          for database in databases:
              cursor.execute(f"GRANT {privileges} ON `{database}`.* TO 'leg_platform'@'%'")
          cursor.execute("SELECT Db FROM mysql.db WHERE User = 'leg_platform' ORDER BY Db")
          stored = [row[0].decode() if isinstance(row[0], bytes) else row[0] for row in cursor.fetchall()]
          if stored != databases:
              raise SystemExit(f"Unexpected grants: {stored}")
          connection.close()
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as environment:
              environment.write(f"DB_USER=leg_platform\nDB_PASSWORD={password}\n")
          EOF

      - name: System checks
        run: python manage.py check --database default --fail-level WARNING

      - name: Deployment checks with production settings
        env:
          APP_ENV: production
          EMAIL_MODE: graph
          DJANGO_ALLOWED_HOSTS: portal.example.org
          INSTANCE_BASE_URL: https://portal.example.org
          INSTANCE_PRIVACY_URL: https://www.example.org/privacy
        run: python manage.py check --deploy --database default --fail-level WARNING

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: python manage.py test --settings=leg_platform.test_settings --verbosity 2
