# Continuous integration of LEG-Platform (docs/DECISIONS.md, D-015, D-026, D-027).
#
# Two jobs prove both ends of the supported range:
# - minimum: the declared minimum versions (requirements/minimum-constraints.txt) with
#   Python 3.12 and MySQL 8.4;
# - latest: the newest compatible releases with Python 3.14 and MySQL 9.7 LTS.
#
# Hardening (GitHub documentation "Security hardening for GitHub Actions"): read-only
# token, no repository secrets, third-party actions pinned to full commit SHAs, service
# images pinned by digest, matrix values passed to scripts through environment variables
# instead of expressions inside "run".
#
# Service images: the digests are those of the multi-platform image index of the official
# Docker image "mysql" for the tag named in the comment, read from
# https://hub.docker.com/v2/repositories/library/mysql/tags/<tag> on 2026-10-11. Dependabot
# does not update images in workflow files (only actions referenced with "uses"); update the
# tag and digest manually when a new patch release is published.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: minimum (Python 3.12, Django 6.0, MySQL 8.4)
            python-version: "3.12"
            # mysql:8.4 (= 8.4.11)
            mysql-image: mysql:8.4.11@sha256:6ea90827b1100f8f2ae306a539f86d2c264a26ed435a2a9f75551dd5c3aeb242
            install-mode: minimum
            django-series: "6.0"
          - name: latest (Python 3.14, Django 6.1, MySQL 9.7)
            python-version: "3.14"
            # mysql:9.7 (= 9.7.2)
            mysql-image: mysql:9.7.2@sha256:e2bde46db6563855d7177adb5f0b57b9dc663f5a20927a90f4259d3312068497
            install-mode: latest
            django-series: "6.1"

    services:
      mysql:
        image: ${{ matrix.mysql-image }}
        env:
          # Throwaway credentials of a service container that exists only during this job;
          # not a secret of any environment.
          MYSQL_ROOT_PASSWORD: ci-only-throwaway-password
          MYSQL_DATABASE: leg_platform
        ports:
          - 3306:3306
        # "mysqladmin ping" returns 0 as soon as the server accepts TCP connections, even on
        # "Access denied" (MySQL 8.4 Reference Manual, mysqladmin).
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    env:
      APP_ENV: local
      DJANGO_DEBUG: "False"
      EMAIL_MODE: console
      DB_NAME: leg_platform
      # Root of the throwaway service container: Django's test runner must create the
      # database test_leg_platform.
      DB_USER: root
      DB_PASSWORD: ci-only-throwaway-password
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      PYTHONWARNINGS: error::DeprecationWarning,error::PendingDeprecationWarning

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Check that the minimum pins match the declared lower bounds
        run: python scripts/check_minimum_constraints.py

      - name: Install build dependencies of mysqlclient
        # mysqlclient publishes no Linux wheels; packages as listed in its installation notes.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-dev default-libmysqlclient-dev build-essential pkg-config

      - name: Install the project
        env:
          PYTHONWARNINGS: ""
          INSTALL_MODE: ${{ matrix.install-mode }}
        run: |
          python -m pip install --upgrade pip
          case "$INSTALL_MODE" in
            minimum) python -m pip install -c requirements/minimum-constraints.txt -e . ;;
            latest) python -m pip install --upgrade -e . ;;
            *) echo "Unknown install mode: $INSTALL_MODE" >&2; exit 1 ;;
          esac
          python -m pip freeze

      - name: Verify the Django release line
        env:
          DJANGO_SERIES: ${{ matrix.django-series }}
        run: python -c "import django, os, sys; s = os.environ['DJANGO_SERIES']; v = django.get_version(); print(v); sys.exit(0 if v == s or v.startswith(s + '.') else 1)"

      - name: Generate a throwaway secret key
        # Generated per job and masked; it protects nothing.
        run: |
          key="$(python -c 'import secrets; print(secrets.token_urlsafe(50))')"
          echo "::add-mask::$key"
          echo "DJANGO_SECRET_KEY=$key" >> "$GITHUB_ENV"

      - name: System checks
        run: python manage.py check --database default --fail-level WARNING

      - name: Deployment checks with production settings
        env:
          APP_ENV: production
          EMAIL_MODE: graph
          DJANGO_ALLOWED_HOSTS: portal.example.org
        run: python manage.py check --deploy --database default --fail-level WARNING

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: python manage.py test --verbosity 2
