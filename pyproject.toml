# Dependency declaration of LEG-Platform (docs/DECISIONS.md, D-015 and D-026).
# Only minimum versions are declared. They are proven by the "minimum" job in
# .github/workflows/ci.yml, which installs exactly the versions pinned in
# requirements/minimum-constraints.txt. Installations use the newest compatible releases.

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "leg-platform"
version = "0.1.0"
description = "Web application for local electricity communities (LEG) in Switzerland."
readme = "README.md"
# SPDX licence expression and licence files (PEP 639; setuptools >= 77.0.0). D-029.
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    # 6.0 is the minimum: the oldest supported release line with built-in Content Security
    # Policy support (D-015, D-026). Its security support ends in April 2027; the minimum is
    # raised then. The upper bound is the newest release line that is tested in continuous
    # integration; it is raised after the next release line passed the tests.
    "Django>=6.0.9,<6.2",
    "mysqlclient>=2.3.0",
    "django-axes>=8.3.1",
    "django-otp>=1.7.4",
    "cryptography>=50.0.2",
    "segno>=1.6.6",
    "msal>=1.39.0",
]

[tool.setuptools.packages.find]
include = ["leg_platform*"]
