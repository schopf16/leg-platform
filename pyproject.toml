# Dependency declaration of LEG-Platform (docs/DECISIONS.md, D-015 and D-026).
# Only minimum versions are declared. They are proven by the "minimum" job in
# .github/workflows/ci.yml, which installs exactly the versions pinned in
# requirements/minimum-constraints.txt. Installations use the newest compatible releases.

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "leg-platform"
version = "0.1.0"
description = "Web application for local electricity communities (LEG) in Switzerland."
readme = "README.md"
# SPDX licence expression and licence files (PEP 639; setuptools >= 77.0.0). D-029.
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    # 6.0 is the minimum: the oldest supported release line with built-in Content Security
    # Policy support (D-015, D-026). Its security support ends in April 2027; the minimum is
    # raised then. The upper bound is the newest release line that is tested in continuous
    # integration; it is raised after the next release line passed the tests.
    "Django>=6.0.9,<6.2",
    "mysqlclient>=2.3.0",
    "django-axes[ipware]>=8.3.1",
    "django-ipware>=8.0.0,<9",
    "django-otp>=1.7.4",
    "cryptography>=50.0.2",
    "segno>=1.6.6",
    "msal>=1.39.0",
    # Profile fields of the user model (D-034).
    "django-countries>=9.1.0",
    "django-phonenumber-field>=8.5.0",
    # Declared directly instead of the extra "django-phonenumber-field[phonenumberslite]",
    # so that the minimum job pins it.
    "phonenumberslite>=9.0.41",
    # Canonicalise internationalised email domains using UTS #46 (D-034).
    "idna>=3.15",
    # Imported directly by leg_platform/mail.py (D-048).
    "requests>=2.34.2",
    # PDF printing of the lists of the management area (D-082): the newest release at the decision; the
    # known advisories (CVE-2019-17626, CVE-2019-19450, CVE-2020-28463, CVE-2023-33733) are fixed in 3.6.13.
    "reportlab>=5.0.1",
    # Checksum and structure of the IBAN of a person (D-087): the established package, pure Python, no
    # dependencies, no network access; the newest release at the decision.
    "python-stdnum>=2.2",
    # WebAuthn verification; D-106. Browser credentials are never verified by custom cryptography.
    "webauthn>=3.0.1",
]

[tool.setuptools.packages.find]
include = ["leg_platform*"]

# Data files that the code reads from its own package directory and that must be in a built wheel: the bundled
# fonts of the PDF printing (D-083, D-084 L-9; a test builds the list from the directory). Templates and static
# files are served from the source tree, as before.
[tool.setuptools.package-data]
"leg_platform.management.printing" = ["fonts/*.ttf", "fonts/*.txt"]
